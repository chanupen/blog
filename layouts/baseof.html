<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
{{ partial "head.html" . }}
</head>
<body>
<a href="#main" class="sr-skip">Skip to content</a>
{{ partial "nav.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{ $js := resources.Get "js/main.js" | js.Build (dict "minify" true) }}
<script src="{{ $js.RelPermalink }}?v={{ substr (md5 $js.Content) 0 10 }}" defer></script>
{{ if .Store.Get "hasMermaid" }}{{ partial "mermaid.html" . }}{{ end }}
</body>
</html>
