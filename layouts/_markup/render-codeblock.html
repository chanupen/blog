{{- $lang := .Type | default "text" -}}
{{- $result := transform.HighlightCodeBlock . -}}
<div class="codeblock">
  {{- if ne $lang "text" }}<span class="lang">{{ $lang }}</span>{{ end }}
  <button class="copy-btn" type="button" aria-label="Copy code" title="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
  {{- $result.Wrapped -}}
</div>
